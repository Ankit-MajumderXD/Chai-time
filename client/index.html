<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Chai Time — a private space for your people to share what's happening right now."
    />
    <title>Chai Time</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking: the boot skeleton paints without waiting for fonts. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Inline so the very first frame is the warm ground, never white. -->
    <style>
      html,
      body {
        margin: 0;
        background: #faf8f5;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- First-paint skeleton: shows instantly, before the JS bundle or app CSS
           load. React replaces #root on mount, so this just needs to be a
           dependency-free shape of the app. -->
      <style>
        #boot {
          min-height: 100dvh;
          max-width: 460px;
          margin: 0 auto;
          padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px 24px;
          /* Mirrors --grad-ambient / .bg-ambient (see tokens.css, base.css) so the
             handover from this static splash to React's <AppSkeleton> is seamless. */
          background: linear-gradient(
            130deg,
            #6c5ce7 -12%,
            #b3a6f1 18%,
            #e9e3ff 44%,
            #ffe0c8 78%,
            #fff1d2 108%
          );
          background-size: 260% 260%;
          animation: boot-ambient 11s ease-in-out infinite;
          font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }
        @keyframes boot-ambient {
          0% {
            background-position: 0% 50%;
          }
          50% {
            background-position: 100% 50%;
          }
          100% {
            background-position: 0% 50%;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot {
            animation: none;
            background-position: 32% 50%;
          }
        }
        #boot .sk {
          background: #ece7df;
          border-radius: 12px;
          position: relative;
          overflow: hidden;
        }
        #boot .sk-kicker { width: 96px; height: 13px; margin-bottom: 10px; }
        #boot .sk-title { width: 168px; height: 30px; margin-bottom: 26px; }
        #boot .sk-bar { width: 100%; height: 52px; border-radius: 26px; margin-bottom: 30px; }
        #boot .sk-label { width: 88px; height: 15px; margin-bottom: 16px; }
        #boot .sk-face { width: 56px; height: 56px; }
        #boot .sk-card { width: 100%; height: 210px; border-radius: 28px; margin-bottom: 18px; }
        #boot .sk-card:last-child { margin-bottom: 0; }
        #boot .sk::after {
          content: '';
          position: absolute;
          inset: 0;
          transform: translateX(-100%);
          background: linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.6),
            transparent
          );
          animation: boot-shimmer 1.4s ease-in-out infinite;
        }
        @keyframes boot-shimmer {
          100% {
            transform: translateX(100%);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot .sk::after {
            animation: none;
          }
        }
        #boot .row {
          display: flex;
          gap: 14px;
          align-items: center;
          margin-bottom: 34px;
        }
        #boot .circle {
          border-radius: 999px;
          flex: 0 0 auto;
        }
      </style>
      <div id="boot" aria-label="Loading Chai Time" role="status">
        <div class="sk sk-kicker"></div>
        <div class="sk sk-title"></div>
        <div class="sk sk-bar"></div>
        <div class="sk sk-label"></div>
        <div class="row">
          <div class="sk circle sk-face"></div>
          <div class="sk circle sk-face"></div>
          <div class="sk circle sk-face"></div>
          <div class="sk circle sk-face"></div>
          <div class="sk circle sk-face"></div>
        </div>
        <div class="sk sk-label"></div>
        <div class="sk sk-card"></div>
        <div class="sk sk-card"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
